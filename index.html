<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AprilTag 36h11 — Визуализация</title>
    <style>
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #111; color: #eee; margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }
        h1 { font-size: 1.1rem; font-weight: 400; text-align: center; margin: 0 0 10px 0; color: #aaa; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }
        
        #video-container {
            position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
            border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
        }
        #video { display: none; }
        #canvas { width: 100%; height: 100%; display: block; object-fit: contain; }
        
        .controls { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
        
        .size-input-container {
            display: flex; align-items: center; gap: 8px;
            background: #333; padding: 8px 12px; border-radius: 8px;
            border: 1px solid #555; font-size: 14px;
        }
        .size-input-container input {
            background: #222; color: #fff; border: 1px solid #444;
            padding: 6px; border-radius: 4px; width: 60px;
            text-align: center; font-size: 14px;
        }
        .size-input-container input:focus { outline: none; border-color: #4ade80; }

        button, .file-label {
            background: #333; color: #fff; border: 1px solid #555; padding: 10px 16px;
            border-radius: 8px; font-size: 14px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; transition: background 0.2s;
        }
        button:hover, .file-label:hover { background: #444; }
        .file-label input[type="file"] { display: none; }
        
        #vis-container {
            width: 100%; background: #2a2a2a; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); position: relative;
        }
        #vis-canvas { width: 100%; height: 300px; display: block; }

        /* Стили для встроенной консоли */
        #console-container {
            width: 100%; max-width: 500px; margin-top: 15px; margin-bottom: 30px;
            background: #0a0a0a; border: 1px solid #333; border-radius: 12px; overflow: hidden;
        }
        .console-header {
            background: #222; padding: 8px 12px; font-size: 12px; color: #888;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333;
        }
        .console-header button {
            padding: 4px 8px; font-size: 11px; border-radius: 4px; background: #444;
        }
        #console-output {
            width: 100%; height: 200px; overflow-y: auto; padding: 10px; box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; line-height: 1.4;
            white-space: pre-wrap; word-break: break-all;
        }
        .log-log { color: #4ade80; }
        .log-warn { color: #fbbf24; }
        .log-error { color: #f87171; font-weight: bold; }
        .log-info { color: #60a5fa; }
    </style>
</head>
<body>

    <!-- Скрипт перехвата консоли (в самом начале) -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const consoleOutput = document.getElementById('console-output');
            
            function safeStringify(obj) {
                try { return typeof obj === 'object' ? JSON.stringify(obj) : String(obj); } 
                catch (e) { return String(obj); }
            }

            function appendToConsole(args, type) {
                if (!consoleOutput) return;
                const time = new Date().toLocaleTimeString();
                const msg = Array.from(args).map(safeStringify).join(' ');
                
                const el = document.createElement('div');
                el.className = `log-${type}`;
                el.textContent = `[${time}] ${msg}`;
                consoleOutput.appendChild(el);
                
                // Авто-прокрутка вниз
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            // Перехватываем стандартные методы
            const origLog = console.log;
            console.log = function(...args) {
                origLog.apply(console, args);
                appendToConsole(args, 'log');
            };

            const origWarn = console.warn;
            console.warn = function(...args) {
                origWarn.apply(console, args);
                appendToConsole(args, 'warn');
            };

            const origError = console.error;
            console.error = function(...args) {
                origError.apply(console, args);
                appendToConsole(args, 'error');
            };

            const origInfo = console.info;
            console.info = function(...args) {
                origInfo.apply(console, args);
                appendToConsole(args, 'info');
            };

            // Перехватываем глобальные ошибки и промисы
            window.addEventListener('error', (e) => {
                appendToConsole([`Ошибка: ${e.message} (${e.filename}:${e.lineno})`], 'error');
            });
            window.addEventListener('unhandledrejection', (e) => {
                appendToConsole([`Promise Error: ${e.reason}`], 'error');
            });

            // Очистка консоли
            document.getElementById('clear-console-btn').addEventListener('click', () => {
                consoleOutput.innerHTML = '';
            });
        });
    </script>

    <h1>AprilTag 36h11 · ID 0</h1>

    <div class="container">
        <div id="video-container">
            <video id="video" playsinline autoplay muted></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>

        <div class="controls">
            <div class="size-input-container">
                Размер кода: 
                <input type="number" id="tag-size-input" value="20" min="0.1" max="1000" step="0.01" inputmode="decimal">
                см
            </div>
        </div>

        <div class="controls">
            <label class="file-label">
                📁 Загрузить фото
                <input type="file" id="file-input" accept="image/*">
            </label>
            <button id="camera-btn" style="display: none;">📷 Вернуться к камере</button>
        </div>

        <div id="vis-container">
            <canvas id="vis-canvas" width="500" height="300"></canvas>
        </div>
    </div>

    <!-- Блок встроенной консоли -->
    <div id="console-container">
        <div class="console-header">
            <span>Встроенная консоль</span>
            <button id="clear-console-btn">Очистить</button>
        </div>
        <div id="console-output"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <script src="https://unpkg.com/comlink/dist/umd/comlink.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            'use strict';

            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const visCanvas = document.getElementById('vis-canvas');
            const visCtx = visCanvas.getContext('2d');
            
            const fileInput = document.getElementById('file-input');
            const cameraBtn = document.getElementById('camera-btn');
            const tagSizeInput = document.getElementById('tag-size-input');

            const CAMERA_MATRIX = { fx: 939.33, fy: 938.25, cx: 640.34, cy: 340.71 };

            let isVideoMode = true;
            let apriltagDetector = null;
            let tagSizeCm = parseFloat(tagSizeInput.value) || 20;

            function drawSchematic(tx, ty, tz, distance, invPose, statusText = 'Ожидание...', isError = false) {
                try {
                    const w = visCanvas.width;
                    const h = visCanvas.height;
                    visCtx.clearRect(0, 0, w, h);

                    const wallY = 40;
                    const tagCenterX = w / 2;
                    const tagCenterY = wallY;
                    const tagWidth = 60;

                    visCtx.beginPath(); visCtx.moveTo(0, wallY); visCtx.lineTo(w, wallY);
                    visCtx.strokeStyle = '#000000'; visCtx.lineWidth = 6; visCtx.stroke();

                    visCtx.beginPath();
                    visCtx.moveTo(tagCenterX - tagWidth/2, tagCenterY); visCtx.lineTo(tagCenterX + tagWidth/2, tagCenterY);
                    visCtx.strokeStyle = '#00aaff'; visCtx.lineWidth = 8; visCtx.stroke();

                    visCtx.fillStyle = '#ffffff'; visCtx.font = 'bold 16px sans-serif'; visCtx.textAlign = 'left';
                    visCtx.fillText('код', tagCenterX + tagWidth/2 + 10, tagCenterY + 5);

                    if (distance === null) {
                        visCtx.fillStyle = isError ? '#ff5555' : '#cccccc'; 
                        visCtx.font = 'bold 14px sans-serif'; 
                        visCtx.textAlign = 'center';
                        visCtx.fillText(statusText, w/2, h/2 + 20);
                        return;
                    }

                    const scale = 120; 
                    const phoneX = tagCenterX + (tx * scale) + (tz * scale * 0.2);
                    const phoneY = tagCenterY + (ty * scale);

                    visCtx.beginPath(); visCtx.moveTo(tagCenterX, tagCenterY); visCtx.lineTo(phoneX, phoneY);
                    visCtx.strokeStyle = '#999999'; visCtx.lineWidth = 5; visCtx.stroke();

                    const midX = (tagCenterX + phoneX) / 2;
                    const midY = (tagCenterY + phoneY) / 2;
                    visCtx.fillStyle = '#ffffff'; visCtx.font = 'bold 20px sans-serif'; visCtx.textAlign = 'right';
                    visCtx.fillText(distance.toFixed(2) + 'm', midX - 15, midY - 10);

                    let phoneAngle = 0;
                    if (invPose) phoneAngle = Math.atan2(invPose[1][0], invPose[0][0]);

                    visCtx.save();
                    visCtx.translate(phoneX, phoneY);
                    visCtx.rotate(phoneAngle);
                    visCtx.beginPath(); visCtx.moveTo(-25, 0); visCtx.lineTo(25, 0);
                    visCtx.strokeStyle = '#00cc66'; visCtx.lineWidth = 8; visCtx.stroke();
                    visCtx.restore();

                    visCtx.fillStyle = '#ffffff'; visCtx.font = 'bold 16px sans-serif'; visCtx.textAlign = 'center';
                    visCtx.fillText('телефон', phoneX, phoneY + 30);
                } catch (e) {
                    console.error("Ошибка отрисовки схемы:", e);
                }
            }

            drawSchematic(0, 0, 0, null, null, 'Инициализация...');
            console.log("Скрипт запущен. Инициализация камеры и детектора...");

            async function startCamera() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' }
                    });
                    video.srcObject = stream;
                    await video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    isVideoMode = true;
                    cameraBtn.style.display = 'none';
                    console.log("Камера успешно запущена.");
                    
                    if (apriltagDetector) requestAnimationFrame(processVideoFrame);
                } catch (err) {
                    console.error('Ошибка камеры:', err);
                    drawSchematic(0, 0, 0, null, null, 'Нет доступа к камере.', true);
                }
            }

            async function initDetector() {
                try {
                    if (typeof Comlink === 'undefined') throw new Error("Comlink не загружен");
                    
                    console.log("Загрузка Web Worker (apriltag.js)...");
                    const worker = new Worker('https://arenaxr.github.io/apriltag-js-standalone/apriltag.js');
                    const ApriltagWorker = Comlink.wrap(worker);

                    apriltagDetector = await new ApriltagWorker(
                        Comlink.proxy(async () => {
                            console.log("WASM модуль загружен. Настройка параметров камеры...");
                            await apriltagDetector.set_camera_info(
                                CAMERA_MATRIX.fx, CAMERA_MATRIX.fy, CAMERA_MATRIX.cx, CAMERA_MATRIX.cy
                            );
                            await apriltagDetector.set_tag_size(0, tagSizeCm / 100);
                            console.log(`Размер тега установлен: ${tagSizeCm} см`);
                            
                            drawSchematic(0, 0, 0, null, null, 'Детектор готов.');
                            await startCamera();
                        })
                    );
                } catch (e) {
                    console.error("Ошибка инициализации детектора:", e);
                    drawSchematic(0, 0, 0, null, null, 'Ошибка библиотеки.', true);
                }
            }

            async function processImageData() {
                if (!apriltagDetector) return;

                let imageData;
                try {
                    imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                } catch (e) {
                    console.error('Ошибка чтения getImageData:', e);
                    return;
                }

                const pixels = imageData.data;
                const grayscale = new Uint8Array(canvas.width * canvas.height);
                for (let i = 0, j = 0; i < pixels.length; i += 4, j++) {
                    grayscale[j] = Math.round(0.299 * pixels[i] + 0.587 * pixels[i + 1] + 0.114 * pixels[i + 2]);
                }

                let detections = [];
                try {
                    detections = await apriltagDetector.detect(grayscale, canvas.width, canvas.height);
                } catch (e) {
                    console.warn('Ошибка детектирования:', e);
                }

                const targetTag = detections.find(d => d.id === 0);

                if (targetTag) {
                    const corners = targetTag.corners;
                    ctx.beginPath(); ctx.lineWidth = 3; ctx.strokeStyle = '#4ade80';
                    ctx.moveTo(corners[0].x, corners[0].y);
                    for (let i = 1; i < corners.length; i++) ctx.lineTo(corners[i].x, corners[i].y);
                    ctx.closePath(); ctx.stroke();
                }

                if (targetTag && targetTag.pose && targetTag.pose.length >= 16) {
                    try {
                        const poseMatrix = math.reshape(targetTag.pose, [4, 4]);
                        const invPose = math.inv(poseMatrix);
                        
                        const tx = invPose[0][3];
                        const ty = invPose[1][3];
                        const tz = invPose[2][3];
                        const distance = Math.sqrt(tx*tx + ty*ty + tz*tz);

                        drawSchematic(tx, ty, tz, distance, invPose);
                    } catch (e) {
                        console.error('Ошибка math.js:', e);
                    }
                } else {
                    let msg = 'Тег ID 0 не найден';
                    if (detections.length > 0) msg = 'Найден тег, но НЕ ID 0';
                    drawSchematic(0, 0, 0, null, null, msg, false);
                }
            }

            async function processVideoFrame() {
                if (!isVideoMode) return;
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    await processImageData();
                }
                if (isVideoMode) requestAnimationFrame(processVideoFrame);
            }

            tagSizeInput.addEventListener('change', async () => {
                let val = parseFloat(tagSizeInput.value);
                if (isNaN(val) || val <= 0) {
                    tagSizeInput.value = tagSizeCm;
                    return;
                }
                tagSizeCm = val;
                console.log(`Размер изменен на ${tagSizeCm} см`);
                
                if (apriltagDetector) {
                    await apriltagDetector.set_tag_size(0, tagSizeCm / 100);
                    if (!isVideoMode && canvas.width > 0) {
                        drawSchematic(0, 0, 0, null, null, 'Пересчет...');
                        await processImageData();
                    }
                }
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                isVideoMode = false;
                cameraBtn.style.display = 'inline-flex';
                console.log("Загрузка изображения...");

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = async () => {
                        let w = img.width, h = img.height;
                        if (w > 800) { h = Math.round(h * (800 / w)); w = 800; }
                        
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        drawSchematic(0, 0, 0, null, null, 'Анализ...');
                        console.log(`Фото загружено (${w}x${h}). Запуск детекции...`);

                        if (apriltagDetector) await processImageData();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            cameraBtn.addEventListener('click', async () => {
                fileInput.value = '';
                console.log("Возврат к камере...");
                await startCamera();
            });

            await initDetector();
        });
    </script>
</body>
</html>
